<style>
  :root {
    --pink: #ff4d88;
    --bg: #ffe6f0;
    --card: #ffffff;
    --shadow: 0 10px 25px rgba(0,0,0,0.12);
  }

  body{
    margin:0;
    padding:18px;
    font-family: Arial, sans-serif;
    background: var(--bg);
overflow-y:auto;
overflow-x:hidden;
    text-align:center;
  }

  .card{
    max-width:420px;
    margin: 14vh auto 0;
    background: var(--card);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow);
  }

  h2{ margin: 8px 0 10px; }
  p{ margin: 8px 0; }

  input{
    width:min(320px, 85vw);
    padding:12px 12px;
    font-size:16px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.15);
    outline:none;
  }

  button{
    padding:12px 18px;
    font-size:16px;
    border:none;
    border-radius:12px;
    margin:10px 8px 0;
    cursor:pointer;
    transition: transform 0.12s ease;
  }
  button:active{ transform: scale(0.98); }

  #yesBtn{ background: var(--pink); color:white; }
  #noBtn{
    background:#888; color:white;
    position:absolute;
    z-index: 3;
  }

  /* Popup */
  #overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index: 50;
  }
  #catPopup{
    display:none;
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:min(340px, 92vw);
    background:white;
    border-radius:16px;
    box-shadow:0 0 25px rgba(0,0,0,0.35);
    padding:14px;
    z-index: 60;
  }
  #catPopup img{
    width:100%;
    border-radius:12px;
  }

  .screen{ display:none; }
  #lockScreen{ display:block; }

  /* Map */
  #mapWrap{
    width: min(1000px, 95vw);
    height: min(520px, 68vh);
    margin: 18px auto 0;
    border-radius: 18px;
    background: white;
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
  }

  #mapViewport{
    width:100%;
    height:100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    position: relative;
    background: #fffdf7;
  }

  #mapCanvas{
    width: 1500px;
    height: 950px;
    position: relative;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,77,136,0.10), transparent 35%),
      radial-gradient(circle at 75% 65%, rgba(0,0,0,0.05), transparent 40%),
      linear-gradient(0deg, rgba(0,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: auto, auto, 40px 40px, 40px 40px;
  }

  #pathSvg{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  /* Car (image) */
  #car{
    position:absolute;
    width:52px;
    height:52px;
    transform: translate(-50%, -50%);
    transition: left 0.85s ease, top 0.85s ease, transform 0.85s ease;
    z-index: 5;
    pointer-events:none;
  }
  #car img{
    width:100%;
    height:100%;
    display:block;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.18));
  }

  /* Make the car feel less “static” while it moves */
  #car.moving img{
    animation: carWiggle 0.22s ease-in-out infinite alternate;
  }
  @keyframes carWiggle{
    from { transform: translateY(0px) scale(1); }
    to   { transform: translateY(-2px) scale(1.01); }
  }

  /* Date stamps */
  .stamp{
    position:absolute;
    transform: translate(-50%, -50%);
    padding:10px 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.90);
    box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    border: 1px solid rgba(255,77,136,0.25);
    font-size: 14px;
    text-align:center;
    max-width: 190px;
  }
  .stamp .dot{
    width:10px; height:10px;
    border-radius:999px;
    background: rgba(255,77,136,0.85);
    margin: 0 auto 6px;
  }
  .stamp button{
    margin-top:8px;
    padding:8px 10px;
    font-size:13px;
    border-radius:12px;
    background: rgba(255,77,136,0.12);
    color: #a3003a;
  }

  /* Timeline panel */
  #memoryPanel{
    max-width: 1000px;
    width: min(1000px, 95vw);
    margin: 16px auto 0;
    background:white;
    border-radius:18px;
    padding: 16px;
    box-shadow: var(--shadow);
    text-align:left;
  }

  #dateTitle{
    margin: 4px 0 10px;
    text-align:center;
  }

  /* Horizontal image row for the whole date */
  #dateGallery{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding: 8px 2px 12px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .photoCard{
    min-width: min(320px, 82vw);
    background: rgba(0,0,0,0.02);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    scroll-snap-align: start;
  }
  .photoCard img{
    width:100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: 14px;
    display:block;
  }
  .photoCard .cap{
    margin-top: 8px;
    font-size: 14px;
  }

  .row{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top: 10px;
  }

  .muted{ opacity: 0.8; font-size: 13px; text-align:center; }

  /* Video end */
  #videoWrap{
    width: min(900px, 95vw);
    margin: 10vh auto 0;
    border-radius: 18px;
    overflow:hidden;
    box-shadow: var(--shadow);
    position: relative;
    background:#000;
  }
  #timelapseVideo{
    width:100%;
    height:auto;
    display:block;
  }
  
#videoOverlayText{
  position:absolute;
  top:0;
  left:0;
  right:0;

  /* only use the top portion of the video */
  max-height: 45%;
  overflow:auto;
  -webkit-overflow-scrolling: touch;

  padding:14px 16px;
  color:white;
  background: linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0));
  text-align:left;
  font-size: 16px;
  line-height: 1.35;
  white-space: pre-wrap;

  /* IMPORTANT: don't block video controls/taps */
  pointer-events:auto;
}


  /* Final album */
  #albumGrid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-top: 12px;
  }
  #albumGrid img{
    width:100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 14px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  }
  @media (max-width: 520px){
    #albumGrid{ grid-template-columns: repeat(2, 1fr); }
  }

/* =========================
   GROUP BY DATE (timestamp)
========================= */
function extractDate(title){
  const m = title.match(/\(([^)]+)\)/);
  if(!m) return "Unknown date";
  return m[1].trim();
}

let groupedDates = [];
let dateIndex = -1;

function buildGroups(){
  const map = new Map();
  for(const it of memories){
    const d = extractDate(it.title);
    if(!map.has(d)) map.set(d, []);
    map.get(d).push(it);
  }
  groupedDates = Array.from(map.entries()).map(([date, items])=>({date, items}));
}

/* =========================
   MAP + CAR + DATE STAMPS
========================= */
let points = [];

function buildPoints(n){
  const base = [
    {x:170, y:780},
    {x:280, y:720},
    {x:410, y:660},
    {x:560, y:610},
    {x:700, y:560},
    {x:860, y:510},
    {x:1010, y:450},
    {x:1160, y:400},
    {x:1300, y:330},
    {x:1400, y:250}
  ];

  points = [];
  const need = Math.max(n, 2);
  for(let i=0;i<need;i++){
    const t = i/(need-1);
    const segT = t*(base.length-1);
    const seg = Math.floor(segT);
    const local = segT - seg;
    const a = base[Math.min(seg, base.length-2)];
    const b = base[Math.min(seg+1, base.length-1)];
    points.push({
      x: a.x + (b.x-a.x)*local,
      y: a.y + (b.y-a.y)*local
    });
  }

  const path = document.getElementById("routePath");
  const d = points.map((p,idx)=> idx===0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`).join(" ");
  path.setAttribute("d", d);
}

function placeDateStamps(){
  const canvas = document.getElementById("mapCanvas");
  Array.from(canvas.querySelectorAll(".stamp")).forEach(el=>el.remove());

  groupedDates.forEach((group, idx)=>{
    const p = points[Math.min(idx, points.length-1)];
    const stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.style.left = p.x + "px";
    stamp.style.top  = (p.y - 55) + "px";
    stamp.innerHTML = `
      <div class="dot"></div>
      <div><b>${escapeHtml(group.date)}</b></div>
      <div style="font-size:12px; opacity:0.75;">${group.items.length} pics</div>
      <button type="button">Jump</button>
    `;
    stamp.querySelector("button").onclick = () => jumpToDate(idx);
    canvas.appendChild(stamp);
  });
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function focusMapOn(x,y){
  const vp = document.getElementById("mapViewport");
  const vw = vp.clientWidth;
  const vh = vp.clientHeight;
  vp.scrollLeft = Math.max(0, x - vw/2);
  vp.scrollTop  = Math.max(0, y - vh/2);
}

function angleDeg(a,b){
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  return Math.atan2(dy, dx) * (180/Math.PI);
}

function moveCarToPoint(idx){
  const car = document.getElementById("car");
  const p = points[Math.min(idx, points.length-1)];

  car.classList.add("moving");
  car.style.left = p.x + "px";
  car.style.top  = p.y + "px";

  const prev = points[Math.max(0, Math.min(idx-1, points.length-1))];
  const ang = angleDeg(prev, p);
  car.style.transform = `translate(-50%, -50%) rotate(${ang}deg)`;

  setTimeout(()=> car.classList.remove("moving"), 900);
}

  moveCarToPoint(0);

}

function renderDate(group){
  document.getElementById("dateTitle").innerText = group.date;

  const gallery = document.getElementById("dateGallery");
  gallery.innerHTML = "";

  group.items.forEach(item=>{
    const card = document.createElement("div");
    card.className = "photoCard";
    card.innerHTML = `
      <img src="${item.img}" alt="memory">
      <div class="cap">${escapeHtml(item.title)}</div>
    `;
    gallery.appendChild(card);
  });
}

function nextDate(){
  initAudioOnce();
  dateIndex++;

  if(dateIndex >= groupedDates.length){
    playDil();
    showVideoScreen();
    return;
  }

  document.getElementById("nextBtn").innerText =
    (dateIndex === groupedDates.length - 1) ? "One last thing 😭❤️" : "Next date 💗";

  moveCarToPoint(dateIndex);
  const p = points[Math.min(dateIndex, points.length-1)];
  focusMapOn(p.x, p.y);

  setTimeout(()=> renderDate(groupedDates[dateIndex]), 850);
}

function jumpToDate(idx){
  if(idx < 0 || idx >= groupedDates.length) return;
  initAudioOnce();
  dateIndex = idx - 1;
  nextDate();
}

function panMoveFn(e){
  if(!isPanning) return;
  const vp = document.getElementById("mapViewport");
  const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
  const dx = p.clientX - panStart.x;
  const dy = p.clientY - panStart.y;
  vp.scrollLeft = panStart.sl - dx;
  vp.scrollTop = panStart.st - dy;
}
function panEndFn(){ isPanning=false; }

/* =========================
   ON LOAD
========================= */
window.onload = function(){
  const noBtn = document.getElementById("noBtn");
  noBtn.style.left = "55%";
  noBtn.style.top  = "70%";

  buildGroups();
  buildPoints(groupedDates.length);
  placeDateStamps();
  buildAlbum();

  const canvas = document.getElementById("mapCanvas");
  canvas.addEventListener("mousedown", panStartFn);
  window.addEventListener("mousemove", panMoveFn);
  window.addEventListener("mouseup", panEndFn);

  canvas.addEventListener("touchstart", panStartFn, {passive:true});
  window.addEventListener("touchmove", panMoveFn, {passive:true});
  window.addEventListener("touchend", panEndFn);
};
</script>
</head>

<body>

<!-- Audio (UPDATED TO YOUR ACTUAL FILES) -->
<audio id="dilAudio" src="audio/DilKayIsharay.mpeg" loop></audio>
<audio id="highAudio" src="audio/HighOnYou.mpeg" loop></audio>
